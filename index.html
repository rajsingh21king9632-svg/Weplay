<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support & Report</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:#f4f6f8;color:#222;transition:.3s}
body.dark{background:#111827;color:#fff}
header{text-align:center;padding:30px 15px 20px;position:relative}
.logo-link{display:block;width:140px;height:140px;margin:auto;text-decoration:none}
.logo{width:140px;height:140px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#2563eb;box-shadow:0 8px 25px rgba(0,0,0,.25);transition:.25s}
.logo:hover{transform:scale(1.05)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
header h1{margin-top:15px;font-size:26px}
.theme-btn{position:absolute;right:15px;top:20px;width:45px;height:45px;border:0;border-radius:50%;background:#222;color:#fff;font-size:20px;cursor:pointer}
main{width:92%;max-width:650px;margin:auto;padding-bottom:30px}
.section{background:#fff;margin-top:20px;padding:22px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08);transition:.3s}
body.dark .section{background:#1f2937}
.section h2{margin-bottom:15px;font-size:21px}
label{display:block;margin:13px 0 6px;font-weight:bold}
input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;outline:0;font-size:15px}
input:focus,textarea:focus{border-color:#2563eb}
textarea{min-height:100px;resize:vertical}
body.dark input,body.dark textarea{background:#374151;color:#fff;border-color:#4b5563}
.btn{width:100%;margin-top:17px;padding:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.btn:hover{opacity:.9}
.whatsapp{background:#25D366;text-decoration:none;display:block;text-align:center}
.family{text-align:center;margin-top:20px;padding:22px;border-radius:16px;background:#e5e7eb}
body.dark .family{background:#374151}
.coming{margin-top:8px;font-weight:bold;color:#f59e0b}
footer{text-align:center;padding:20px;opacity:.7;font-size:13px}
</style>
</head>
<body>
<header>
<button class="theme-btn" id="themeBtn" aria-label="Toggle day and night mode">🌙</button>
<a href="https://kommodo.ai/i/rMrunYBY33txf0RPMyd7" target="_blank" rel="noopener noreferrer" class="logo-link">
<div class="logo"><img src="logo.png" alt="Logo"></div>
</a>
<h1>Support & Report</h1>
</header>

<main>
<section class="section">
<h2>🛠️ Support OK</h2>
<label for="roomId">Room ID</label>
<input type="text" id="roomId" placeholder="Enter Room ID" autocomplete="off">
<label for="colour">Colour</label>
<input type="text" id="colour" placeholder="Enter Colour" autocomplete="off">
<label for="supportDateTime">Date & Time</label>
<input type="datetime-local" id="supportDateTime">
<button class="btn" onclick="supportSubmit()">Submit Support</button>
</section>

<section class="section">
<h2>🚨 Report ID</h2>
<label for="reportId">ID</label>
<input type="text" id="reportId" placeholder="Enter ID" autocomplete="off">
<label for="reason">Reason</label>
<textarea id="reason" placeholder="Enter reason"></textarea>
<button class="btn" onclick="reportSubmit()">Submit Report</button>
</section>

<section class="section">
<h2>💬 Join Our WhatsApp Group</h2>
<a class="btn whatsapp" href="YOUR_GROUP_LINK" target="_blank" rel="noopener noreferrer">Join WhatsApp Group</a>
</section>

<div class="family">
<h2>👨‍👩‍👧 Family Tag</h2>
<p class="coming">Coming Soon 🚀</p>
</div>
</main>

<footer>© 2026 Support & Report</footer>

<script>
const themeBtn=document.getElementById("themeBtn");
themeBtn.addEventListener("click",function(){
document.body.classList.toggle("dark");
if(document.body.classList.contains("dark")){
themeBtn.textContent="☀️";localStorage.setItem("theme","dark");
}else{
themeBtn.textContent="🌙";localStorage.setItem("theme","light");
}});
if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");themeBtn.textContent="☀️";
}

function setCurrentDateTime(){
const now=new Date();
const localDateTime=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
document.getElementById("supportDateTime").value=localDateTime;
}
setCurrentDateTime();

function supportSubmit(){
const roomId=document.getElementById("roomId").value.trim();
const colour=document.getElementById("colour").value.trim();
const dateTime=document.getElementById("supportDateTime").value;
if(!roomId||!colour||!dateTime){
alert("Please enter Room ID, Colour and Date & Time.");return;
}
alert("Support submitted successfully!\n\nRoom ID: "+roomId+"\nColour: "+colour+"\nDate & Time: "+dateTime);
}

function reportSubmit(){
const id=document.getElementById("reportId").value.trim();
const reason=document.getElementById("reason").value.trim();
if(!id||!reason){
alert("Please enter ID and Reason.");return;
}
alert("Report submitted successfully!\n\nID: "+id+"\nReason: "+reason);
}
</script>
</body>
</html>
